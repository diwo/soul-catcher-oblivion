; Capturing a larger soul replaces a smaller soul in non-black soul gems.
set SCSG.soulGemReplaceSoul to 1

; Shrink souls to fit smaller soul gems when a larger gem is not available.
set SCSG.soulGemShrinkToFit to 1

; Release a captured soul if it wouldn't fully fill a non-black soul gem.
set SCSG.soulGemKeepOnlyFull to 0

; Release souls smaller than grand from black soul gems.
set SCSG.blackSoulGemKeepOnlyGrand to 1

; The proportion of souls captured into soul gems that will passively power up
; the Azura's Star. A value of 0.2 means whenever a soul is captured, 20% of its
; soul charges would also be added to the Azura's Star's charges. For example,
; capturing a Common Soul (worth 800 charges) would fill up a Common Soul Gem
; and simultaneously increase the Azura's Star charges by 160 points. This can be
; disabled by changing the value to 0 to fill Asura's Star like other soul gems.
set SCSG.azurasStarChargeRate to 0.2

; The maximum amount of soul charges the Azura's Star can accumulate passively.
set SCSG.azurasStarMaxCharges to 3200

; Display message with soul size after a capture.
set SCSG.showCaptureDetail to 1

; Debug logging verbosity between 0 to 3.
set SCSG.debug to 0
